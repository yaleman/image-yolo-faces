[project]
name = "image-yolo-faces"
version = "0.1.0"
description = "Batch face detection with YOLOv8"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "click>=8.1.8",
    "fastapi>=0.135.1",
    "huggingface-hub>=1.7.2",
    "insightface>=0.7.3",
    "jinja2>=3.1.6",
    "numpy<3",
    "onnx<1.22",
    "onnxruntime>=1.24.3",
    "pillow>=11.3.0",
    "python-multipart>=0.0.26",
    "supervision>=0.27.0.post2",
    "ultralytics>=8.4.24",
    "uvicorn>=0.42.0",
]

[project.scripts]
image-yolo-faces = "image_yolo_faces.cli:cli"
image-yolo-faces-web = "image_yolo_faces.web:main"

[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["image_yolo_faces*"]

[tool.setuptools.package-data]
image_yolo_faces = ["templates/*.html", "static/*", "static/**/*"]

[tool.uv]
package = true

[tool.mypy]
files = ["image_yolo_faces", "tests", "frontend/tests/support", "scripts"]

[dependency-groups]
dev = [
    "mypy>=1.20.0",
    "pytest>=9.0.2",
    "pytest-cov>=7.1.0",
    "ruff>=0.15.7",
    "ty>=0.0.24",
]
