[tools]
biome = "latest"
pnpm = "latest"

[tasks.tsc-check]
run = "pnpm exec tsc --noEmit --project tsconfig.json"
[tasks.biome-check]
run = "biome check frontend vite.config.js playwright.config.ts biome.json --fix"
[tasks.frontend-check]
depends = ["tsc-check", "biome-check"]

[tasks.build-frontend]
depends = ["frontend-check"]
run = ["vite build"]

[tasks.coverage-frontend]
run = "pnpm test:e2e:coverage"

[tasks.coverage-frontend-open]
depends = ["coverage-frontend"]
run = ["open output/playwright/coverage/index.html"]

[tasks.python-coverage]
run = "rm -rf output/python-coverage && COVERAGE_FILE=output/python-coverage/.coverage uv run pytest --cov=image_yolo_faces --cov-report=term-missing --cov-report=html:output/python-coverage"


[tasks.ruff]
run = "uv run ruff check"

[tasks.ty]
run = "uv run ty check"

[tasks.python-check]
depends = ["ruff", "ty"]

[tasks.check]
depends = ["frontend-check", "python-check"]

[tasks.start]
depends = ["build-frontend", "python-check"]
run = ["uv run image-yolo-faces-web"]
