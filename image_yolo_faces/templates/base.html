<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{{ title }}</title>
    <link rel="stylesheet" href="{{ url_for('static', path='app.css') }}">
  </head>
  <body>
    <header class="site-bar">
      <form class="search-bar search-bar-global" method="get" action="/">
        <label class="search-field">
          <span class="sr-only">Search annotated images</span>
          <input type="search" name="q" value="{{ search_query }}" placeholder="Search" autocomplete="off">
        </label>
      </form>
    </header>
    <main class="shell">
      {% block content %}{% endblock %}
    </main>
  </body>
</html>
