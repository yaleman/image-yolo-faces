<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{{ title }}</title>
    {% for css_href in frontend_assets.css %}
    <link rel="stylesheet" href="{{ css_href }}">
    {% endfor %}
  </head>
  <body>
    <header class="site-bar">
      <form class="search-bar search-bar-global" method="get" action="/">
        <label class="search-field">
          <input type="search" name="q" value="{{ search_query }}" placeholder="Search" autocomplete="off">
        </label>
      </form>
    </header>
    <main class="shell">
      {% block content %}{% endblock %}
    </main>
    {% if frontend_assets.js %}
    <script type="module" src="{{ frontend_assets.js }}"></script>
    {% endif %}
  </body>
</html>
